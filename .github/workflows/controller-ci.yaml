name: Controller CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
  workflow_dispatch:

jobs:
  update-partior-tag:
    uses: partior-libs/controller-3p-pipelines/.github/workflows/pipeline-template-controller-ci.yaml@feature/DSO-4174_support_jira_oath
    with:
      CONTROLLER-REF: feature/DSO-4174_support_jira_oath
    secrets: inherit
